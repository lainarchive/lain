[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lain"
version = "0.1.0"
description = "A local-first development environment for projects, models, agents, memory, and tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "lainarchive"}]
dependencies = []

[project.scripts]
lain = "lain.cli:main"

[tool.setuptools.packages.find]
include = ["lain*"]
