[lain]
name = "lain."
version = "0.1.0"

[models]
backend = "ollama"
model = "SparkLLM/Spark-X2.5-4B:latest"

[agents]
count = 8

[paths]
# Discovery roots are configurable through LAIN_PROJECT_ROOTS.
# The default is the user's home directory; only recognizable projects
# directly inside the root are recorded.
projects = "~"
memory = "~/lain/memory"
sandbox = "~/lain/sandbox"
