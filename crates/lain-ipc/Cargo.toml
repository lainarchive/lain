[package]
name = "lain-ipc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lain-plugin = { path = "../lain-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
