[package]
name = "lain-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "lain"
path = "src/main.rs"

[dependencies]
lain-ipc = { path = "../lain-ipc" }
lain-agent = { path = "../lain-agent" }
lain-core = { path = "../lain-core" }
lain-memory = { path = "../lain-memory" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
futures = "0.3"

[lints]
workspace = true
