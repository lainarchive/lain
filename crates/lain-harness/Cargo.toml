[package]
name = "lain-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
futures = "0.3"
lain-core = { path = "../lain-core" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"

[lints]
workspace = true
