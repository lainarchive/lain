[package]
name = "lain-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lain-core = { path = "../lain-core" }
lain-memory = { path = "../lain-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
tempfile = "3"

[lints]
workspace = true
