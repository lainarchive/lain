[package]
name = "lain-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
jsonschema = { version = "0.33", default-features = false }
lain-context = { path = "../lain-context" }
lain-memory = { path = "../lain-memory" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
