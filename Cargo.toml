[package]
name = "lain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lain-cli = { path = "crates/lain-cli" }

[dev-dependencies]
lain-ipc = { path = "crates/lain-ipc" }
tempfile = "3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[lints]
workspace = true

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "warn"
await_holding_lock = "deny"
dbg_macro = "deny"
print_stdout = "warn"
